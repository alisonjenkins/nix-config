name: Build and Cache Nix Flake

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_push:
        description: >-
          Push closures to niks3 even when the dry-run says everything is
          cached. Use this to repopulate the remote cache after the
          self-hosted runners' persistent /nix/store has built paths that
          never made it to niks3.
        type: boolean
        default: false
  workflow_run:
    workflows: ["Update and push flake lock"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Lightweight server builds — self-hosted runner with nix (fully cached,
  # ~2 min each). The 5-way matrix queues against maxRunners on the scale set,
  # but each leg is near-instant against the runner's persistent /nix/store.
  build-servers:
    runs-on: home-nix-builder-amd64
    timeout-minutes: 360
    # Backstop: never run fork-PR code on the home self-hosted runner, even if a
    # `pull_request` trigger is added here by mistake. Inert for push events
    # (github.event.pull_request is null → null != true → true).
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && github.event.pull_request.head.repo.fork != true }}
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - .#nixosConfigurations.download-server-1.config.system.build.toplevel
          - .#nixosConfigurations.home-k8s-master-1.config.system.build.toplevel
          - .#nixosConfigurations.home-k8s-server-1.config.system.build.toplevel
          - .#nixosConfigurations.home-kvm-hypervisor-1.config.system.build.toplevel
          - .#nixosConfigurations.home-storage-server-1.config.system.build.toplevel
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      # home-nix-builder-amd64 runs in home-cluster-1; niks3 lives in aws-k3s,
      # so the cluster-internal service DNS (niks3.niks3.svc.cluster.local) does
      # not resolve. Use the public ingress URL.
      NIKS3_SERVER_URL: https://api.nixcache.org
      # Per-matrix-leg queue: the runner pods are ephemeral so /var/tmp is not
      # shared, but keep the names distinct anyway to stay robust if that
      # changes.
      NIKS3_QUEUE: /var/tmp/niks3-queue-servers
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Skip if superseded
        uses: ./.github/actions/skip-if-superseded
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
      - uses: DeterminateSystems/flake-checker-action@v12
      - name: Check if build is needed
        id: dry-run
        run: |
          dry_output=$(nix build --dry-run '${{ matrix.configuration }}' 2>&1)
          echo "$dry_output"
          if echo "$dry_output" | grep -q 'will be built:'; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "All derivations are cached — skipping build"
          fi
      - name: Install niks3
        if: steps.dry-run.outputs.needs_build == 'true'
        run: .github/scripts/install-niks3.sh
      - name: Build and push to cache in parallel
        if: steps.dry-run.outputs.needs_build == 'true'
        env:
          NIKS3_TOKEN: ${{ secrets.NIKS3_TOKEN }}
        run: |
          source .github/scripts/niks3-background-push.sh
          niks3_start_drainer

          # Build, appending output paths to queue
          set +e
          nix build -L --keep-going --print-out-paths \
            --out-link "$(niks3_gcroot_path 'servers')" '${{ matrix.configuration }}' \
            2> >(tee /tmp/nix-build-stderr.log | grep --line-buffered -iE '(^[^ ]*> (building|configuring|installing|compiling|linking|cmake|make\[)|building .*/nix/store|copying path|fetching)' >&2) >> "$NIKS3_QUEUE"
          BUILD_EXIT=$?
          set -e

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT"
            echo "--- Full build stderr (last 100 lines) ---"
            tail -100 /tmp/nix-build-stderr.log
          fi

          niks3_stop_and_final_push

          exit $BUILD_EXIT

  # Heavy x86_64 desktop/laptop builds — self-hosted runner with nix
  build-desktops:
    runs-on: home-nix-builder-amd64
    timeout-minutes: 1440
    # Backstop: never run fork-PR code on the home self-hosted runner, even if a
    # `pull_request` trigger is added here by mistake. Inert for push events
    # (github.event.pull_request is null → null != true → true).
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
      actions: read
    env:
      # home-nix-builder-amd64 runs in home-cluster-1; niks3 lives in aws-k3s,
      # so the cluster-internal service DNS (niks3.niks3.svc.cluster.local) does
      # not resolve. Use the public ingress URL.
      NIKS3_SERVER_URL: https://api.nixcache.org
      # Host nix daemon post-build-hook writes to /var/tmp/niks3-queue
      NIKS3_QUEUE: /var/tmp/niks3-queue
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Skip if superseded
        uses: ./.github/actions/skip-if-superseded

      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix

      - name: Check if any desktop build is needed
        id: dry-run
        run: |
          needs_build=false
          for cfg in ali-desktop ali-framework-laptop ali-steam-deck ali-work-laptop; do
            if dry_output=$(nix build --dry-run ".#nixosConfigurations.${cfg}.config.system.build.toplevel" 2>&1); then
              if echo "$dry_output" | grep -q 'will be built:'; then
                needs_build=true
                echo "$cfg needs building"
              else
                echo "$cfg is fully cached"
              fi
            else
              needs_build=true
              echo "$cfg dry-run failed (needs building)"
            fi
          done
          # The standalone-package loop that lived here only ever held
          # camoufox-browser, which no longer builds; see the note in the build
          # step below.
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"

      - name: Install niks3
        if: steps.dry-run.outputs.needs_build == 'true' || inputs.force_push == true
        run: .github/scripts/install-niks3.sh

      - name: Build and push to cache
        if: steps.dry-run.outputs.needs_build == 'true' || inputs.force_push == true
        env:
          NIKS3_TOKEN: ${{ secrets.NIKS3_TOKEN }}
        run: |
          source .github/scripts/niks3-background-push.sh
          niks3_start_drainer

          # Build each config sequentially, appending output paths to queue.
          # When force_push is set, the dry-run gate is bypassed, but `nix
          # build` is still near-instant for paths already in the local
          # store; --print-out-paths emits the toplevel paths into the
          # queue, and the drainer expands them via `nix path-info
          # --recursive` before pushing. niks3 server-side dedup skips paths
          # already present in the remote cache.
          set +e
          any_failed=false
          for cfg in ali-desktop ali-framework-laptop ali-steam-deck ali-work-laptop; do
            echo "=== Building $cfg ==="
            if nix build -L --keep-going --print-out-paths \
              --out-link "$(niks3_gcroot_path "$cfg")" \
              ".#nixosConfigurations.${cfg}.config.system.build.toplevel" \
              2> >(tee -a /tmp/nix-build-stderr.log | grep --line-buffered -iE '(^[^ ]*> (building|configuring|installing|compiling|linking|cmake|make\[)|building .*/nix/store|copying path|fetching)' >&2) >> "$NIKS3_QUEUE"; then
              echo "=== $cfg complete ==="
            else
              echo "::warning::$cfg build failed"
              any_failed=true
            fi
          done
          # Standalone packages built + pushed on this runner used to be built
          # here. camoufox-browser was the only entry and it no longer compiles
          # against Firefox 150.0.2:
          #   webrender_ffi_generated.h:6708:53: error: use of undeclared
          #   identifier 'COUNT'
          # It is an upstream break unrelated to the host closures, and leaving
          # it in made build-desktops red after every otherwise-successful run.
          # Restore the loop once the package builds again.
          set -e

          niks3_stop_and_final_push

          if [ "$any_failed" = true ]; then
            echo "::group::Full nix build stderr log"
            cat /tmp/nix-build-stderr.log 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

  # aarch64-linux builds — self-hosted ARM runner with nix
  # Disabled: ARM runner offline pending re-enable on aws-k3s.
  # Restore by removing `if: false &&` below.
  build-arm64:
    runs-on: aws-nix-builder-arm64
    timeout-minutes: 1440
    if: ${{ false && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    permissions:
      contents: read
      actions: read
    env:
      NIKS3_SERVER_URL: http://niks3.niks3.svc.cluster.local
      # Host nix daemon post-build-hook writes to /var/tmp/niks3-queue
      NIKS3_QUEUE: /var/tmp/niks3-queue
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Skip if superseded
        uses: ./.github/actions/skip-if-superseded

      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix

      - name: Check if any arm64 build is needed
        id: dry-run
        run: |
          needs_build=false
          for cfg in dev-vm; do
            if dry_output=$(nix build --dry-run ".#nixosConfigurations.${cfg}.config.system.build.toplevel" 2>&1); then
              if echo "$dry_output" | grep -q 'will be built:'; then
                needs_build=true
                echo "$cfg needs building"
              else
                echo "$cfg is fully cached"
              fi
            else
              needs_build=true
              echo "$cfg dry-run failed (needs building)"
            fi
          done
          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"

      - name: Install niks3
        if: steps.dry-run.outputs.needs_build == 'true' || inputs.force_push == true
        run: .github/scripts/install-niks3.sh

      - name: Build and push to cache
        if: steps.dry-run.outputs.needs_build == 'true' || inputs.force_push == true
        env:
          NIKS3_TOKEN: ${{ secrets.NIKS3_TOKEN }}
        run: |
          source .github/scripts/niks3-background-push.sh
          niks3_start_drainer

          # Build each config sequentially, appending output paths to queue.
          # See build-desktops above for force_push semantics.
          set +e
          any_failed=false
          for cfg in dev-vm; do
            echo "=== Building $cfg ==="
            if nix build -L --keep-going --print-out-paths \
              --out-link "$(niks3_gcroot_path "$cfg")" \
              ".#nixosConfigurations.${cfg}.config.system.build.toplevel" \
              2> >(tee -a /tmp/nix-build-stderr.log | grep --line-buffered -iE '(^[^ ]*> (building|configuring|installing|compiling|linking|cmake|make\[)|building .*/nix/store|copying path|fetching)' >&2) >> "$NIKS3_QUEUE"; then
              echo "=== $cfg complete ==="
            else
              echo "::warning::$cfg build failed"
              any_failed=true
            fi
          done
          set -e

          niks3_stop_and_final_push

          if [ "$any_failed" = true ]; then
            echo "::group::Full nix build stderr log"
            cat /tmp/nix-build-stderr.log 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi
