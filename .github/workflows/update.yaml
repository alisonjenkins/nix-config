name: Update and push flake lock

on:
  schedule:
    # Off the hour: GitHub's scheduler is busiest at :00 and has been
    # starting the 02:00 run seven or more hours late.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      manual:
        description: >-
          Also open the review PR for inputs whose tier does not auto-merge
          (sensitive, individual-code). Otherwise that runs on Mondays only.
        type: boolean
        default: false
  repository_dispatch:
    types: [update-flake-lock]

jobs:
  build:
    # Self-hosted NixOS runner: it already has Nix, so no installer action is
    # needed. It also removes the version-skew hazard that forced a pin here —
    # the host's Nix is the same build the machines being updated run, so
    # nested `follows` serialise identically and flake.lock stops churning
    # between CI and local `nix flake update`.
    runs-on: home-nix-builder-amd64
    timeout-minutes: 60
    # Backstop: never run fork-PR code on the home self-hosted runner, even if
    # a `pull_request` trigger is added here by mistake. Inert for schedule and
    # dispatch events (github.event.pull_request is null → null != true → true).
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get the updater App token
        id: app-token
        # Pushes and PRs made with GITHUB_TOKEN start no pull_request
        # workflows (GitHub holds them for a maintainer's approval), so the
        # required flake-check never reports. A dispatched run does not count
        # as that check either. The ajenkins-nix-config-updater App's token does start
        # them. It is scoped to this repository, contents and pull requests
        # only: no workflows permission, so it cannot change CI.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          repositories: nix-config
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
        with:
          extra-tools: gh
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
      - name: Setup git
        run: |
          git config --global user.name 'Github Actions'
          git config --global user.email 'alisonjenkins-gha@users.noreply.github.com'
      - name: Update flake
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          # Unauthenticated github: input fetches share the runner's IP and
          # hit GitHub's unauth API rate limit (60/hr) fast with ~15+ inputs
          # -> "API rate limit exceeded" 403s. Authenticate nix's own fetcher.
          NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
        run: |
          set -euo pipefail
          # main requires the "flake-check" status check, which only runs on
          # pull_request (pr-check.yaml) — a direct push here can never
          # satisfy it. Go through a PR instead, and let it auto-merge once
          # flake-check passes.
          # run_attempt makes a manual rerun (same run_id) use a fresh branch
          # instead of colliding with the previous attempt's still-open PR.
          branch="flake-update-${{ github.run_id }}-${{ github.run_attempt }}"
          git fetch origin main
          git checkout -B "$branch" origin/main
          # Not `nix flake update`: that takes every input's newest commit.
          # update-policy bump applies each input's tier cooldown
          # (docs/update-policy.md) to the auto-merge tiers only, and records
          # when it first saw each upstream commit in pins/flake-seen.json.
          summary="$RUNNER_TEMP/flake-bump-auto.md"
          nix run .#update-policy -- bump --apply --group auto --summary "$summary"
          git add flake.lock pins/flake-seen.json
          if git diff --cached --quiet; then
            echo "::notice::no input is due an update and no new upstream commits were seen"
            exit 0
          fi
          git commit -m "chore(flake): nightly flake.lock update"
          git push origin "HEAD:$branch"
          pr_url=$(gh pr create \
            --title "chore(flake): nightly flake.lock update" \
            --body-file "$summary" \
            --base main \
            --head "$branch")
          echo "::notice::opened $pr_url, waiting for flake-check to auto-merge"
          # Every night's lock supersedes the last. A night whose flake-check
          # fails leaves its PR open and BEHIND main forever, so they pile up
          # unless the next run closes them. Best effort: failing to tidy must
          # not stop this PR's auto-merge being armed.
          new_number="${pr_url##*/}"
          for old in $(gh pr list --state open --author "app/$APP_SLUG" \
              --search 'in:title "chore(flake): nightly flake.lock update"' \
              --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"flake-update-\")) | select(.number != $new_number) | .number"); do
            gh pr close "$old" --delete-branch --comment "Superseded by $pr_url." \
              || echo "::warning::could not close superseded PR #$old"
          done
          # The App opened the PR, so pr-check (flake-check) and
          # adr-repo-claims start on their own as pull_request runs.
          gh pr merge --rebase --auto --delete-branch "$pr_url"
          # Do not wait here for the merge. flake-check runs on this same
          # self-hosted runner, so a job that waits holds the runner the check
          # needs, and anything that happens after a timeout goes unhandled
          # (2026-11-23: #1070 passed after the job gave up, then sat BEHIND
          # main). update-shepherd.yaml takes over from here: it rebases the
          # PR when main moves and opens an issue when it fails or stalls.
          echo "::notice::auto-merge armed on $pr_url; update-shepherd.yaml follows it from here"

  # Inputs whose tier does not auto-merge (sensitive, individual-code) are
  # bumped weekly into one PR for a human to read. Runs after the nightly job
  # has opened its PR (it no longer waits for the merge), so this PR may need
  # "Update branch" once the nightly merges.
  review:
    needs: build
    if: ${{ always() && github.event.pull_request.head.repo.fork != true && (inputs.manual || github.event_name == 'schedule') }}
    runs-on: home-nix-builder-amd64
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Get the updater App token
        id: app-token
        # Pushes and PRs made with GITHUB_TOKEN start no pull_request
        # workflows (GitHub holds them for a maintainer's approval), so the
        # required flake-check never reports. A dispatched run does not count
        # as that check either. The ajenkins-nix-config-updater App's token does start
        # them. It is scoped to this repository, contents and pull requests
        # only: no workflows permission, so it cannot change CI.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.UPDATER_APP_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          repositories: nix-config
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
        with:
          extra-tools: gh
      - name: Open the review PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
          MANUAL: ${{ inputs.manual }}
        run: |
          set -euo pipefail
          if [ "$MANUAL" != true ] && [ "$(date -u +%u)" != 1 ]; then
            echo "::notice::review PR runs on Mondays (or with the manual input)"
            exit 0
          fi
          git config --global user.name 'Github Actions'
          git config --global user.email 'alisonjenkins-gha@users.noreply.github.com'
          title="chore(flake): weekly update of inputs that need review"
          branch="flake-review-${{ github.run_id }}-${{ github.run_attempt }}"
          git fetch origin main
          git checkout -B "$branch" origin/main
          summary="$RUNNER_TEMP/flake-bump-manual.md"
          nix run .#update-policy -- bump --apply --group manual --summary "$summary"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "::notice::no input that needs review is due an update"
            exit 0
          fi
          git commit -m "$title"
          git push origin "HEAD:$branch"
          {
            echo
            echo "These inputs' tiers do not auto-merge. Read each upstream diff before merging; see docs/update-policy.md."
          } >> "$summary"
          pr_url=$(gh pr create --title "$title" --body-file "$summary" --base main --head "$branch")
          echo "::notice::opened $pr_url for review"
          new_number="${pr_url##*/}"
          for old in $(gh pr list --state open --author "app/$APP_SLUG" \
              --search "in:title \"$title\"" --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"flake-review-\")) | select(.number != $new_number) | .number"); do
            gh pr close "$old" --delete-branch --comment "Superseded by $pr_url." \
              || echo "::warning::could not close superseded PR #$old"
          done
