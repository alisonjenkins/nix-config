name: Update and push flake lock

on:
  schedule:
    # Weekly, Monday 02:00 UTC. Nightly bumps mostly superseded each other
    # before anyone deployed them.
    - cron: "0 2 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [update-flake-lock]

# Serialise runs: each run closes the open flake-update PRs other than its
# own, so two overlapping runs would close each other's PR. Never cancel a
# run that may already have opened its PR.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    # Self-hosted NixOS runner: it already has Nix, so no installer action is
    # needed. It also removes the version-skew hazard that forced a pin here —
    # the host's Nix is the same build the machines being updated run, so
    # nested `follows` serialise identically and flake.lock stops churning
    # between CI and local `nix flake update`.
    runs-on: home-nix-builder-amd64
    timeout-minutes: 60
    # Backstop: never run fork-PR code on the home self-hosted runner, even if
    # a `pull_request` trigger is added here by mistake. Inert for schedule and
    # dispatch events (github.event.pull_request is null → null != true → true).
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    # The built-in token is not used to write anything: the branch push and
    # the PR go through the flake-update App's token below.
    permissions:
      contents: read
    steps:
      # Why an App token and not GITHUB_TOKEN: the repo's fork-PR approval
      # policy is `all_external_contributors` (OpenTofu, github/ stack), and
      # GitHub counts github-actions[bot] as an external contributor, so every
      # PR opened with GITHUB_TOKEN had its pull_request runs held at "Action
      # required" on the home runner. A PR opened by an App installed on this
      # repo with write access runs its checks like Renovate's do, with the
      # approval policy left as it is. The token is scoped to this repo and
      # to contents + pull-requests, and is revoked when the job ends.
      - name: Get flake-update App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.FLAKE_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLAKE_UPDATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The branch push must come from the App, or its pull_request runs
          # are held for approval again.
          token: ${{ steps.app-token.outputs.token }}
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
        with:
          extra-tools: gh
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
      - name: Setup git
        run: |
          git config --global user.name 'Github Actions'
          git config --global user.email 'alisonjenkins-gha@users.noreply.github.com'
      - name: Update flake
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Unauthenticated github: input fetches share the runner's IP and
          # hit GitHub's unauth API rate limit (60/hr) fast with ~15+ inputs
          # -> "API rate limit exceeded" 403s. Authenticate nix's own fetcher.
          # The read-only built-in token is enough for public inputs.
          NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
        run: |
          set -euo pipefail
          # main requires the "flake-check" status check (pr-check.yaml),
          # which only runs on pull_request — a direct push here can never
          # satisfy it. Go through a PR instead, and let it auto-merge once
          # flake-check passes.
          # run_attempt makes a manual rerun (same run_id) use a fresh branch
          # instead of colliding with the previous attempt's still-open PR.
          branch="flake-update-${{ github.run_id }}-${{ github.run_attempt }}"
          git fetch origin main
          git checkout -B "$branch" origin/main
          nix flake update --commit-lock-file
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "::notice::flake.lock already up to date, nothing to do"
            exit 0
          fi
          git push origin "HEAD:$branch"
          pr_url=$(gh pr create \
            --title "chore(flake): weekly flake.lock update" \
            --body "Automated weekly \`nix flake update\`." \
            --base main \
            --head "$branch")
          echo "::notice::opened $pr_url, waiting for flake-check to auto-merge"
          # Each week's lock supersedes the last. A week whose flake-check
          # fails leaves its PR open and BEHIND main forever, so they pile up
          # unless the next run closes them. Matches this repo's own
          # flake-update-* branches with a chore(flake) title only (never a
          # fork's), whoever opened them, so the old github-actions[bot]
          # nightly PRs are tidied too. Best
          # effort: failing to tidy must not stop this PR's auto-merge.
          new_number="${pr_url##*/}"
          for old in $(gh pr list --state open --base main \
              --json number,title,headRefName,isCrossRepository \
              --jq ".[] | select(.isCrossRepository | not) | select(.headRefName | startswith(\"flake-update-\")) | select(.title | startswith(\"chore(flake): \")) | select(.number != $new_number) | .number"); do
            gh pr close "$old" --delete-branch --comment "Superseded by $pr_url." \
              || echo "::warning::could not close superseded PR #$old"
          done
          gh pr merge --rebase --auto --delete-branch "$pr_url"

          # --auto only arms auto-merge and returns immediately, so without
          # this the job would report success even when flake-check fails
          # and the PR is left open. Poll until it actually merges or closes.
          for _ in $(seq 1 60); do
            state=$(gh pr view "$pr_url" --json state -q .state)
            case "$state" in
              MERGED)
                echo "::notice::$pr_url merged"
                exit 0
                ;;
              CLOSED)
                echo "::error::$pr_url closed without merging"
                exit 1
                ;;
            esac
            # main requires an up-to-date branch; a push to main while the
            # check runs leaves the PR BEHIND and auto-merge waits forever.
            # The rebase is pushed with the App token, so it starts a fresh
            # pull_request run by itself.
            if [ "$(gh pr view "$pr_url" --json mergeStateStatus -q .mergeStateStatus)" = BEHIND ]; then
              gh pr update-branch --rebase "$pr_url"
            fi
            sleep 30
          done
          echo "::error::$pr_url did not merge within timeout"
          exit 1
