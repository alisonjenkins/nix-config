name: Update and push flake lock

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-flake-lock]

jobs:
  build:
    # Self-hosted NixOS runner: it already has Nix, so no installer action is
    # needed. It also removes the version-skew hazard that forced a pin here —
    # the host's Nix is the same build the machines being updated run, so
    # nested `follows` serialise identically and flake.lock stops churning
    # between CI and local `nix flake update`.
    runs-on: home-nix-builder-amd64
    timeout-minutes: 60
    # Backstop: never run fork-PR code on the home self-hosted runner, even if
    # a `pull_request` trigger is added here by mistake. Inert for schedule and
    # dispatch events (github.event.pull_request is null → null != true → true).
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
        with:
          extra-tools: gh
      - uses: DeterminateSystems/flake-checker-action@v13
      - name: Setup git
        run: |
          git config --global user.name 'Github Actions'
          git config --global user.email 'alisonjenkins-gha@users.noreply.github.com'
      - name: Update flake
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # main requires the "flake-check" status check, which only runs on
          # pull_request (pr-check.yaml) — a direct push here can never
          # satisfy it. Go through a PR instead, and let it auto-merge once
          # flake-check passes.
          branch="flake-update-${{ github.run_id }}"
          git fetch origin main
          git checkout -B "$branch" origin/main
          nix flake update --commit-lock-file
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "::notice::flake.lock already up to date, nothing to do"
            exit 0
          fi
          git push origin "HEAD:$branch"
          pr_url=$(gh pr create \
            --title "chore(flake): nightly flake.lock update" \
            --body "Automated nightly \`nix flake update\`." \
            --base main \
            --head "$branch")
          echo "::notice::opened $pr_url, waiting for flake-check to auto-merge"
          gh pr merge --rebase --auto --delete-branch "$pr_url"
