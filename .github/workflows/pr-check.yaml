name: PR check

# Runs on every pull request so it produces a status on the PR's head commit
# — none of this repo's other workflows trigger on `pull_request` (they're
# all push/tag/schedule/dispatch), so nothing else can gate branch protection
# or Renovate automerge on green.
#
# Scope: reusable flake outputs only (nixosModules, homeModules, overlays,
# devShells, packages) via .github/scripts/pr-check-x86_64-linux.sh — NOT
# whole-host nixosConfigurations/homeConfigurations. Evaluating even one
# desktop host's full toplevel took several minutes, and building it queued
# 1000+ derivations; both are far too slow for a per-PR gate across ~15
# hosts. Host config breakage still gets caught on push via
# build-and-cache.yaml — this only needs to catch a broken module/package/
# devShell before a dependency bump merges unattended. Packages whose pkgs/
# directory the PR changes are built, not just evaluated: a stale dependency
# hash only shows at build time. aarch64-linux hosts are the exception:
# nothing else covers them since the arm64 build job is disabled, so they are
# evaluated (not built). The script runs its sections in parallel and
# evaluates each output set in one nix eval: the whole check took ~47s
# locally and ~1m45s here, against ~6 min run back to back. Each section
# also runs only when the PR's diff can affect it, and a flake.nix/flake.lock/
# overlays/lib/flake-modules change runs them all (ADR 0062); PR_CHECK_FULL=1
# forces everything. See the script's
# own header for the fuller history (IFD, disk exhaustion, cross-arch — all
# real dead ends hit getting here).
#
# Self-hosted (home-nix-builder-amd64), not GitHub-hosted: has the
# persistent /nix/store this repo's flake inputs and closures expect, same
# reason build-and-cache.yaml/update.yaml/closure-report.yaml all use it.
#
# Fork-PR guard: this repo has one collaborator (you), so the realistic
# fork-PR exposure is low, but the backstop costs nothing and matches every
# other self-hosted workflow here — a forked PR gets no run at all, so it
# can never satisfy this required check (forked-PR automerge is impossible
# by construction, not by policy).

on:
  pull_request:
  # Manual runs only. A dispatched run does NOT satisfy the required
  # `flake-check` on a PR, which is why update.yaml opens its PRs with the
  # ajenkins-nix-config-updater App rather than GITHUB_TOKEN.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: home-nix-builder-amd64
    timeout-minutes: 30
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
      # A new pin without a registry entry (reason, deadline, probe) fails
      # here, and so does an entry whose pin has gone. Overdue pins only warn:
      # the weekly pins workflow raises issues for those, so an unrelated PR
      # is never blocked by someone else's deadline.
      - name: Pin registry
        run: >-
          nix shell --inputs-from . nixpkgs#python3 --command bash -c
          "python3 scripts/pins.py check
          && python3 -m unittest discover -s scripts/tests -p test_pins.py"
      # Every flake input and GitHub Action needs a trust tier in
      # pins/sources.json, and Actions outside the `own` tier must be pinned
      # to a commit SHA (docs/update-policy.md). Building the package runs
      # its tests; the check itself reads flake.lock and .github.
      - name: Update policy sources
        run: nix run .#update-policy -- check
      - name: PR check (modules, overlays, devShells, packages, aarch64 hosts)
        run: .github/scripts/pr-check-x86_64-linux.sh

  # Gate 4 of docs/update-policy.md: no new CVE in any NixOS host that is high
  # or critical, known exploited (CISA KEV) or likely to be (EPSS). Runs on
  # every PR so it can be a required check, but only scans when flake.lock or
  # overlays/ change, and then only the hosts whose derivation changed
  # (scripts/cve-scan.sh); otherwise it passes in seconds. Evaluates every
  # host twice (base and head), so it is a separate job with its own, longer
  # timeout.
  cve-scan:
    runs-on: home-nix-builder-amd64
    timeout-minutes: 90
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
    outputs:
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
      - name: Test the scanner
        run: >-
          nix shell --inputs-from . nixpkgs#bats nixpkgs#python3 nixpkgs#jq --command bash -c
          "bats scripts/tests/cve-scan.bats
          && python3 -m unittest discover -s scripts/tests -p 'test_cve_*.py'"
      - name: vulnix, base against head
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CVE_REPORT: ${{ runner.temp }}/cve-report.md
        run: scripts/cve-scan.sh "$BASE_SHA"
      # Passed on even when the scan fails, so the comment says why. Empty
      # when the scan was skipped, and then no comment is posted.
      - name: Hand the report to cve-comment
        id: report
        if: always() && github.event_name == 'pull_request'
        env:
          CVE_REPORT: ${{ runner.temp }}/cve-report.md
        run: |
          [ -s "$CVE_REPORT" ] || exit 0
          # cve-comment receives it in one environment variable, which Linux
          # caps at 128 KiB, and a comment holds 65536 characters: cut it
          # here. The job summary keeps the whole report.
          report="$CVE_REPORT"
          if [ "$(wc -c <"$CVE_REPORT")" -gt 60000 ]; then
            report="$RUNNER_TEMP/cve-report.cut.md"
            { head -c 60000 "$CVE_REPORT"; printf '\n\n_Cut short; the full report is in the job summary._\n'; } >"$report"
          fi
          eof="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "report<<$eof"; cat "$report"; echo "$eof"; } >>"$GITHUB_OUTPUT"

  # One comment on the PR with the CVE report, edited in place on each push.
  # A job of its own on a GitHub-hosted runner, so the only job holding a
  # token that can write to the PR never checks out or runs the PR's code;
  # the report reaches it as data, through an environment variable.
  cve-comment:
    needs: cve-scan
    if: ${{ always() && github.event_name == 'pull_request' && needs.cve-scan.outputs.report != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the CVE scan comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ needs.cve-scan.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- cve-scan:report -->'
          body="$RUNNER_TEMP/body.md"
          # Already cut to fit by cve-scan's last step.
          printf '%s\n%s\n\n[Scan run](%s)\n' "$marker" "$REPORT" "$RUN_URL" >"$body"
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" |
            jq -rs --arg m "$marker" 'add | map(select(.user.login == "github-actions[bot]" and (.body | startswith($m)))) | first | .id // empty')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" >/dev/null
          fi
