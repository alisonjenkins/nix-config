# Build + publish the magic-vr-pack modpack on tag push.
#
# Triggered by:
#   * pushing a tag matching `magic-vr-pack-v*` (e.g. magic-vr-pack-v0.2.1)
#   * manual workflow_dispatch
#
# Outputs:
#   * Server OCI image ghcr.io/<owner>/magic-vr-pack-server:<v-version> + :latest
#     (amd64 only; there is no arm64 build of this pack)
#   * Client zip attached to the GitHub release for that tag
#
# Auth: GITHUB_TOKEN only (packages: write for GHCR, contents: write for the
# release). Modelled on arkana-aeronautics-release.yaml.

name: magic-vr-pack — release

on:
  push:
    tags:
      - 'magic-vr-pack-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)publish (e.g. magic-vr-pack-v0.2.1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # release asset upload + tag read
  packages: write   # ghcr push

jobs:
  build-and-publish:
    # Self-hosted NixOS runner: its /nix/store already holds most mod jars.
    runs-on: home-nix-builder-amd64
    timeout-minutes: 360
    # Never run fork-PR code on the home self-hosted runner.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/magic-vr-pack-server
    steps:
      - name: Checkout (fetch the tagged commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}
          lfs: false

      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix

      - name: Build server image + client zip
        id: build
        run: |
          set -euo pipefail
          # Root the outputs so a GC between build and publish can't take
          # them. The tools- prefix keeps the niks3 <runid>-* sweep off it.
          root=(--no-link)
          mkdir -p /nix/var/nix/gcroots/gha 2>/dev/null || true
          if [ -w /nix/var/nix/gcroots/gha ]; then
            root=(--out-link "/nix/var/nix/gcroots/gha/tools-${GITHUB_RUN_ID:-manual}-magic-vr-pack")
          fi
          nix build "${root[@]}" --print-out-paths \
            ".#packages.x86_64-linux.minecraft-magic-vr-pack-image" \
            ".#packages.x86_64-linux.magic-vr-pack-client" \
            > build-out.txt
          server_tar=$(sed -n '1p' build-out.txt)
          client_dir=$(sed -n '2p' build-out.txt)
          client_zip=$(ls "$client_dir"/*.zip)
          echo "image_tar=$server_tar" >> "$GITHUB_OUTPUT"
          echo "zip_path=$client_zip"  >> "$GITHUB_OUTPUT"
          ls -lh "$server_tar" "$client_zip"

      - name: Publish (push image + upload zip)
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAR: ${{ steps.build.outputs.image_tar }}
          ZIP_PATH:  ${{ steps.build.outputs.zip_path }}
          # The runner user cannot create /run/containers; keep the login here.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/skopeo-auth.json
        run: |
          set -euo pipefail
          tag_ref="${TAG#magic-vr-pack-}"   # magic-vr-pack-v0.2.1 -> v0.2.1

          # `^out`: skopeo/gh are multi-output; bare paths may print `man` first.
          SKOPEO=$(nix build --no-link --print-out-paths 'nixpkgs#skopeo^out')/bin/skopeo
          GH=$(nix build --no-link --print-out-paths 'nixpkgs#gh^out')/bin/gh

          echo "$GH_TOKEN" | "$SKOPEO" --insecure-policy login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

          (
            for t in "${tag_ref}" latest; do
              "$SKOPEO" --insecure-policy copy \
                "docker-archive:$IMAGE_TAR" "docker://${IMAGE}:${t}"
            done
            echo "::notice::Pushed ${IMAGE}:${tag_ref} and ${IMAGE}:latest"
          ) &
          push_pid=$!

          (
            if ! "$GH" release view "$TAG" >/dev/null 2>&1; then
              "$GH" release create "$TAG" \
                --title "magic-vr-pack — $TAG" \
                --notes "Auto-generated by .github/workflows/magic-vr-pack-release.yaml. Import the zip in CurseForge or Prism Launcher."
            fi
            "$GH" release upload "$TAG" "$ZIP_PATH" --clobber
            echo "::notice::Attached client zip to release $TAG"
          ) &
          upload_pid=$!

          wait "$push_pid"   || { echo "image push failed" >&2; exit 1; }
          wait "$upload_pid" || { echo "release upload failed" >&2; exit 1; }
