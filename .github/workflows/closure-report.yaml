name: Closure Size Report

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Cache Nix Flake"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: home-nix-builder-amd64
    timeout-minutes: 120
    # Backstop: never run fork-PR code on the home self-hosted runner, even if a
    # `pull_request` trigger is added here by mistake. Inert for workflow_run
    # (github.event.pull_request is null → null != true → true).
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && github.event.pull_request.head.repo.fork != true }}
    strategy:
      fail-fast: false
      matrix:
        host:
          - ali-desktop
          - ali-framework-laptop
          - ali-work-laptop
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Skip if superseded
        uses: ./.github/actions/skip-if-superseded
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
        with:
          # scripts/closure-report.sh drives its JSON handling through python3,
          # which the bare ARC runner image does not ship.
          extra-tools: python3
          # Desktop closures pull from caches beyond the repo-wide set.
          extra-substituters: >-
            https://nix-gaming.cachix.org
            https://rust-overlay.cachix.org
            https://attic.xuyh0120.win/lantian
          extra-trusted-public-keys: >-
            nix-gaming.cachix.org-1:nbjlureqMbRAxR1gJ/f3hxemL9svXaZF/Ees8vCUUs4=
            rust-overlay.cachix.org-1:l2scEhXR2wTljEGAr/OGGykVBVbvHI/phxoBUwxaXkk=
            lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=
      - name: Generate closure report
        run: |
          ./scripts/closure-report.sh \
            ".#nixosConfigurations.${{ matrix.host }}" \
            "${{ matrix.host }}-closure-report.md"
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: closure-report-${{ matrix.host }}
          path: ${{ matrix.host }}-closure-report.md
      - name: Print top 30
        run: head -36 "${{ matrix.host }}-closure-report.md"
