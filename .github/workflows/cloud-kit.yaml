name: Cloud kit

# Build packages.x86_64-linux.cloud-kit, push its closure to cache.nixcache.org,
# and record its store path on the `cloud-kit` branch, where Claude cloud
# sessions read it with git (they cannot evaluate this flake; see
# pkgs/cloud-kit/default.nix and docs/cloud-kit.md). The branch is generated:
# each publish is a single orphan commit, force-pushed, and only when the path
# changed. PR check already builds the package on pull requests, so this runs
# on main only.

on:
  push:
    branches: [main]
    paths:
      - "home/skills/**"
      - "home/programs/claude-code/agents/**"
      - "home/programs/claude-code/anthropic-skills.nix"
      - "home/programs/shared-mandates.nix"
      - "pkgs/**"
      - "overlays/**"
      - "flake-modules/cloud-kit.nix"
      - "flake-modules/lib.nix"
      - "flake.lock"
      - ".github/workflows/cloud-kit.yaml"
  workflow_dispatch:

concurrency:
  group: cloud-kit
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    runs-on: home-nix-builder-amd64
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      NIKS3_SERVER_URL: https://api.nixcache.org
      NIKS3_QUEUE: /var/tmp/niks3-queue-cloud-kit
    steps:
      - uses: actions/checkout@v7
      - name: Configure host Nix
        uses: ./.github/actions/setup-host-nix
      - name: Install niks3
        run: .github/scripts/install-niks3.sh
      - name: Build the kit and push it to the cache
        id: build
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
          NIKS3_TOKEN: ${{ secrets.NIKS3_TOKEN }}
        run: |
          set -euo pipefail
          source .github/scripts/niks3-background-push.sh
          niks3_start_drainer
          nix build -L --print-out-paths \
            --out-link "$(niks3_gcroot_path 'cloud-kit')" \
            .#packages.x86_64-linux.cloud-kit > kit-path
          cat kit-path >> "$NIKS3_QUEUE"
          niks3_stop_and_final_push
          echo "path=$(cat kit-path)" >> "$GITHUB_OUTPUT"
      - name: Check the whole closure substitutes from the caches
        # Sessions substitute from cache.nixcache.org and cache.nixos.org only;
        # a path missing from both would fail the session's setup script.
        env:
          KIT: ${{ steps.build.outputs.path }}
        run: |
          set -euo pipefail
          missing=0
          while read -r p; do
            if ! nix path-info --store https://cache.nixcache.org "$p" > /dev/null 2>&1 \
              && ! nix path-info --store https://cache.nixos.org "$p" > /dev/null 2>&1; then
              echo "::error::not in either cache: $p"
              missing=1
            fi
          done < <(nix path-info --recursive "$KIT")
          exit "$missing"
      - name: Publish the store path to the cloud-kit branch
        env:
          KIT: ${{ steps.build.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src_sha="$(git rev-parse HEAD)"
          work="$(mktemp -d)"
          cd "$work"
          printf '%s\n' "$KIT" > x86_64-linux
          printf '%s\n' \
            "Generated by .github/workflows/cloud-kit.yaml from ${src_sha}; do not edit." \
            "x86_64-linux holds the cloud-kit store path. See docs/cloud-kit.md on main." \
            > README
          git init -q -b cloud-kit
          git config user.name 'Github Actions'
          git config user.email 'alisonjenkins-gha@users.noreply.github.com'
          git add -A
          remote="${{ github.server_url }}/${{ github.repository }}"
          git remote add origin "$remote"
          auth="AUTHORIZATION: bearer ${GH_TOKEN}"
          git -c http.extraheader="$auth" fetch -q --depth 1 origin cloud-kit 2>/dev/null || true
          if [ "$(git show FETCH_HEAD:x86_64-linux 2>/dev/null || true)" = "$KIT" ]; then
            echo "cloud-kit branch already points at $KIT; nothing to publish"
            exit 0
          fi
          git commit -q -m "chore(cloud-kit): publish from ${src_sha}"
          git -c http.extraheader="$auth" push -q --force origin HEAD:cloud-kit
          echo "published $KIT from ${src_sha}"
