name: 'Skip if superseded'
description: >
  Fail the job early when a newer run of the SAME workflow is already queued
  on this branch. The self-hosted scale set has few runners, so without this a
  burst of pushes leaves stale runs occupying them ahead of the current one.

  Scoped to this workflow deliberately: an unscoped query sees every queued run
  in the repo, so a dispatched flake update would make an unrelated build skip
  itself.

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        RUN_ID: ${{ github.run_id }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -u
        # GitHub runs composite `run:` blocks under `bash -e -o pipefail`.
        # "no queued runs" is the normal case here, and an empty result makes
        # `grep -o` exit 1, which pipefail turns into a failed step. Turn
        # pipefail off for the query and fail open instead: a hiccup talking to
        # the API should let the job proceed, never abort it.
        set +o pipefail

        # WORKFLOW_REF looks like
        #   owner/repo/.github/workflows/build-and-cache.yaml@refs/heads/main
        # and the runs API accepts the bare filename as the workflow id.
        WORKFLOW_FILE="${WORKFLOW_REF%%@*}"
        WORKFLOW_FILE="${WORKFLOW_FILE##*/}"

        BODY=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
          "https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW_FILE}/runs?status=queued&branch=${BRANCH}&per_page=10") || {
            echo "::warning::Could not query queued runs for ${WORKFLOW_FILE}; proceeding"
            exit 0
          }

        # Nested ids in the payload (actor, repository, ...) are orders of
        # magnitude smaller than a run id, so they never pass the awk filter.
        NEWER=$(printf '%s' "$BODY" \
          | grep -o '"id":[0-9]*' | grep -o '[0-9]*' \
          | awk -v me="$RUN_ID" '$1 > me' | wc -l)

        if [ "${NEWER:-0}" -gt 0 ]; then
          echo "::notice::Skipping this run — $NEWER newer run(s) of $WORKFLOW_FILE queued"
          exit 1
        fi
        echo "Not superseded: no newer queued run of $WORKFLOW_FILE on $BRANCH"
