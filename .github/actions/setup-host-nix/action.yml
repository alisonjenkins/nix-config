name: 'Setup Host Nix'
description: >
  Configure the runner to use the NixOS host's Nix installation via
  mounted /run/current-system/sw and /nix. Creates symlinks for nix
  binaries and writes a nix.conf with flakes, caches, and tuning.
  Only works on self-hosted runners with the NixOS host mounts.

inputs:
  extra-substituters:
    description: >-
      Space-separated substituter URLs to append to the shared defaults.
      For jobs that need caches beyond the repo-wide set (e.g. the closure
      report pulls nix-gaming / rust-overlay / lantian).
    required: false
    default: ''
  extra-trusted-public-keys:
    description: >-
      Space-separated public keys matching `extra-substituters`. Must be
      supplied whenever that input is set, or the extra caches are ignored.
    required: false
    default: ''
  extra-tools:
    description: >-
      Space-separated tool names to guarantee on PATH (e.g. "jq skopeo").
      Taken from the host's system profile when present, otherwise realised
      from nixpkgs via the host Nix. `nix`, git and friends are always set up.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        EXTRA_SUBSTITUTERS: ${{ inputs.extra-substituters }}
        EXTRA_TRUSTED_KEYS: ${{ inputs.extra-trusted-public-keys }}
        EXTRA_TOOLS: ${{ inputs.extra-tools }}
      run: |
        set -euo pipefail

        # Use the host's Nix via mounted /run/current-system/sw
        NIX_SW="/usr/local/nixos-sw/bin"
        if [ ! -x "$NIX_SW/nix" ]; then
          echo "::error::Host Nix not found at $NIX_SW/nix — is /run/current-system/sw mounted?"
          exit 1
        fi

        # Symlink only nix binaries — adding the full NixOS sw/bin to PATH
        # would make GHA use NixOS bash as the step shell, breaking things.
        mkdir -p /tmp/nix-bin
        for cmd in nix nix-build nix-channel nix-collect-garbage nix-copy-closure \
                   nix-daemon nix-env nix-hash nix-instantiate nix-prefetch-url \
                   nix-shell nix-store git; do
          if [ -x "$NIX_SW/$cmd" ]; then ln -sf "$NIX_SW/$cmd" /tmp/nix-bin/; fi
        done
        # Export for the rest of THIS step (the extra-tools realisation below
        # needs both); GITHUB_PATH/GITHUB_ENV only reach subsequent steps.
        export PATH="/tmp/nix-bin:$PATH"
        export NIX_CONF_DIR=/tmp/nix-conf
        echo "/tmp/nix-bin" >> "$GITHUB_PATH"
        echo "NIX_CONF_DIR=/tmp/nix-conf" >> "$GITHUB_ENV"

        # Repo-wide caches. Jobs extend this via the action inputs rather than
        # each rewriting the whole list.
        #
        # cache.garnix.io is deliberately absent — the service shut down (see
        # a7f6189d, which dropped it everywhere else). A dead substituter is
        # not free: nix still probes it for every narinfo, and it now answers
        # with a 503 or hangs until connect-timeout, which showed up as ~40
        # "unable to download .../nix-cache-info: HTTP error 503" warnings in a
        # single desktop build.
        SUBSTITUTERS="https://cache.nixcache.org https://nix-community.cachix.org"
        TRUSTED_KEYS="nixcache.org-1:fd7sIL2BDxZa68s/IqZ8kvDsxsjt3SV4mQKdROuPoak= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs="
        if [ -n "$EXTRA_SUBSTITUTERS" ]; then SUBSTITUTERS="$SUBSTITUTERS $EXTRA_SUBSTITUTERS"; fi
        if [ -n "$EXTRA_TRUSTED_KEYS" ]; then TRUSTED_KEYS="$TRUSTED_KEYS $EXTRA_TRUSTED_KEYS"; fi

        mkdir -p /tmp/nix-conf
        cat > /tmp/nix-conf/nix.conf << NIXCONF
        experimental-features = nix-command flakes
        # Bound parallelism so heavy desktop closure rebuilds don't OOM the
        # k3s control-plane node hosting this runner. Total compiler procs
        # capped at max-jobs * cores = 4 * 4 = 16, matching the node's vCPU
        # count.
        #
        # 98b4dfdf originally pinned this to max-jobs=1 after a global OOM took
        # out k3s and cilium-operator, when the node was 15 GiB / 16 vCPU. It
        # is now 16 vCPU / ~149 GiB, so that ceiling was throttling builds by
        # roughly 4x for a constraint that no longer exists: a single desktop
        # run built 1409 derivations strictly one at a time while the node sat
        # at ~20% CPU and ~20% memory.
        #
        # Keep a cap rather than max-jobs=auto: builds run in the HOST
        # nix-daemon, outside the runner pod's cgroup, so the pod's memory
        # limit does not bound them. This setting is the only guard.
        max-jobs = 4
        cores = 4
        eval-cache = true
        http-connections = 128
        max-substitution-jobs = 128
        narinfo-cache-negative-ttl = 3600
        connect-timeout = 5
        stalled-download-timeout = 10
        fallback = true
        extra-substituters = $SUBSTITUTERS
        extra-trusted-public-keys = $TRUSTED_KEYS
        NIXCONF
        sed -i 's/^        //' /tmp/nix-conf/nix.conf

        # The ARC runner image is a bare Ubuntu container and the NixOS host's
        # system profile carries no guarantee of any given CLI tool, so jobs
        # that need one must declare it. Prefer the host profile (no fetch),
        # fall back to realising it from nixpkgs through the host daemon.
        for tool in $EXTRA_TOOLS; do
          if [ -x "$NIX_SW/$tool" ]; then
            ln -sf "$NIX_SW/$tool" "/tmp/nix-bin/$tool"
          elif command -v "$tool" >/dev/null 2>&1; then
            : # already provided by the runner image
          else
            echo "Realising $tool from nixpkgs..."
            toolpath=$(nix build --no-link --print-out-paths "nixpkgs#$tool^out")
            ln -sf "$toolpath/bin/$tool" "/tmp/nix-bin/$tool"
          fi
        done

        echo "Using host Nix: $("$NIX_SW/nix" --version)"
