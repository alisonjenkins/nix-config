[project]
name = "sift-test-fixture"
revision = "1.0"

# Test-only spec for auth.rs's datadog_auth_names_the_missing_key_when_neither_env_var_is_set.
# DD_API_KEY/DD_APP_KEY are bound via `ref` to env var names nothing in this
# repo or CI ever sets, so the env provider resolves them to Missing
# regardless of the real DD_API_KEY/DD_APP_KEY a developer may have exported
# for their own shell — unlike secretspec.toml's `default` profile, which
# reads those names directly.
[profiles.default]
DD_API_KEY = { required = false, description = "test fixture: always-unset env var", ref = { item = "SIFT_TEST_FIXTURE_UNSET_DD_API_KEY" } }
DD_APP_KEY = { required = false, description = "test fixture: always-unset env var", ref = { item = "SIFT_TEST_FIXTURE_UNSET_DD_APP_KEY" } }

[profiles.default.defaults]
providers = ["env"]
