[project]
name = "sift"
revision = "1.0"

# Named provider aliases, referenced by profiles below via their
# `defaults.providers` list. Not secret material — just a pointer to
# where a profile's values live (a 1Password vault, an AWS region for
# SSM/Secrets Manager, an Azure Key Vault name) — so this table is safe
# to commit. See pkgs/sift/docs/credential-profiles.md before adding
# your own.
[providers]
personal_1password = "onepassword://Personal"
work_awsps = "awsps://us-east-1"

# Declares WHAT sift needs. Never real secret material, so this file is
# safe to commit (secretspec's own convention: "commit the declaration,
# let each environment choose its provider"). All three secrets are
# optional: a profile that resolves none of them leaves sift querying
# unauthenticated (fine for a local, unsecured Loki/Prometheus).
# `--auth-profile <name>` on the sift CLI selects which
# `[profiles.<name>]` section below is used; omitting the flag skips
# secretspec entirely.
[profiles.default]
LGTM_BEARER_TOKEN = { required = false, description = "Bearer token for the Authorization header on Loki/Prometheus queries" }
LGTM_BASIC_AUTH_USER = { required = false, description = "HTTP Basic Auth username for Loki/Prometheus queries (e.g. a Grafana Cloud instance ID)" }
LGTM_BASIC_AUTH_PASSWORD = { required = false, description = "HTTP Basic Auth password for Loki/Prometheus queries (e.g. a Grafana Cloud API key)" }

# No provider bound above means secretspec has nothing to try and
# errors outright, even for an optional secret — "no value" and
# "misconfigured" need to stay distinguishable, so an explicit fallback
# to plain env vars keeps the unbound default profile usable (e.g. for
# CI/headless use) without silently swallowing a real error elsewhere.
[profiles.default.defaults]
providers = ["env"]

# Example: --auth-profile personal, backed by 1Password (shells out to
# the `op` CLI — no cloud credentials needed, just `op signin` first).
[profiles.personal]
LGTM_BEARER_TOKEN = { required = false, description = "Bearer token for the Authorization header on Loki/Prometheus queries" }
LGTM_BASIC_AUTH_USER = { required = false, description = "HTTP Basic Auth username for Loki/Prometheus queries (e.g. a Grafana Cloud instance ID)" }
LGTM_BASIC_AUTH_PASSWORD = { required = false, description = "HTTP Basic Auth password for Loki/Prometheus queries (e.g. a Grafana Cloud API key)" }

[profiles.personal.defaults]
providers = ["personal_1password"]

# Example: --auth-profile work, backed by AWS SSM Parameter Store
# (uses your existing AWS credentials — aws-vault, an assumed role,
# etc.).
[profiles.work]
LGTM_BEARER_TOKEN = { required = false, description = "Bearer token for the Authorization header on Loki/Prometheus queries" }
LGTM_BASIC_AUTH_USER = { required = false, description = "HTTP Basic Auth username for Loki/Prometheus queries (e.g. a Grafana Cloud instance ID)" }
LGTM_BASIC_AUTH_PASSWORD = { required = false, description = "HTTP Basic Auth password for Loki/Prometheus queries (e.g. a Grafana Cloud API key)" }

[profiles.work.defaults]
providers = ["work_awsps"]
