# --- core-libs listed by hand ---
# CurseForge mods carry no dependency metadata, and some Modrinth projects
# omit a required dep or mislabel a common library as client-only.

[[mod]]
modrinth = "architectury-api"   # FTB mods (CurseForge)
group = "core-libs"

[[mod]]
modrinth = "irons-lib"          # irons_spellbooks, undeclared on Modrinth
group = "core-libs"

[[mod]]
modrinth = "playeranimator"     # irons_spellbooks, undeclared on Modrinth
group = "core-libs"

[[mod]]
modrinth = "lodestonelib"       # malum, undeclared on Modrinth
group = "core-libs"

[[mod]]
modrinth = "shatterbyte-lib"    # octolib, for relics
group = "core-libs"

[[mod]]
