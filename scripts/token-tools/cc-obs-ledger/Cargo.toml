[package]
name = "cc-obs-ledger"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "cc_obs_ledger"
path = "src/lib.rs"

[[bin]]
name = "cc-obs-ledger"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
ureq = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
