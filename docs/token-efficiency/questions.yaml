version: 1
regrowth_factor: 1.5
# Collected signals no question asks about; listed so `cc-obs-query unused-signals` stays quiet.
retire:
  - claude_code.session.count
  - claude_code.active_time.total
  - claude_code.lines_of_code.count
  - claude_code.code_edit_tool.decision
  - claude_code.tool_result.tool_input_size_bytes
  - claude_code.tool_result.duration_ms
  - claude_code.api_request
  - claude_code.api_error
  - claude_code.hook_execution.additional_context_chars
  - cc_obs_ledger.session
questions:
  - id: tool-result-size
    title: Which tools return the most tokens per use?
    signals: [claude_code.tool_result.tool_result_size_bytes, claude_code.token.usage]
    query: { command: "cc-obs-query top tool --by tokens" }
    decision_kind: build-tool | configure | dismiss
    threshold: { min_share: 0.03, min_calls: 20 }
  - id: repeat-calls
    title: Which tool calls are repeated or near-identical within a session?
    signals: [cc_obs_ledger.tool_call]
    query: { command: "cc-obs-query repeats" }
    decision_kind: build-tool | configure | dismiss
    threshold: { min_calls: 5 }
  - id: skills-loaded-unused
    # Reads cc_obs_ledger_skill_listed_tokens, which pack.rs does not list as a known signal yet;
    # until the ledger emits it the digest reports this question as unavailable.
    title: Which skills cost tokens without being activated?
    signals: [claude_code.skill_activated, claude_code.token.usage]
    query: { command: "cc-obs-query top skill --unactivated" }
    decision_kind: configure | dismiss
    threshold: { min_share: 0.02 }
  - id: mcp-idle-servers
    # `top mcp` groups tool_result logs by the mcp__<server>__ tool-name prefix. Switch the query
    # to `top mcp --idle` and the title to "connected but never called" once the ledger emits
    # cc_obs_ledger_mcp_server_connected (README "Not yet answerable").
    title: Which MCP servers return the most tokens in tool results?
    signals: [claude_code.tool_result.tool_result_size_bytes]
    query: { command: "cc-obs-query top mcp --by tokens" }
    decision_kind: configure | dismiss
    threshold: { min_share: 0.02 }
  - id: fixed-context-share
    # `--by share` divides the average fixed context by the average request context; the
    # `total` row is the overall share, the other rows are its components.
    title: How much of each request is fixed context?
    signals: [cc_obs_ledger_fixed_context_tokens, cc_obs_ledger_context_tokens]
    query: { command: "cc-obs-query top fixed --by share" }
    decision_kind: configure | dismiss
    threshold: { min_value: 0.05 }
  - id: reread-same-file
    title: Which sessions read the same file input three or more times?
    signals: [cc_obs_ledger.tool_call]
    query: { command: "cc-obs-query repeats --tool Read" }
    decision_kind: build-tool | configure | dismiss
    threshold: { min_calls: 3 }
  - id: cache-hit-low-sessions
    title: Which sessions have a low prompt-cache hit ratio?
    signals: [cc_obs_ledger_cache_hit_ratio, claude_code.token.usage]
    query: { command: "cc-obs-query top session --by cache-hit" }
    decision_kind: configure | dismiss
  - id: subagent-overhead
    title: Which sub-agent types use the most tokens?
    signals: [claude_code.subagent_completed.total_tokens, claude_code.token.usage]
    query: { command: "cc-obs-query top subagent --by tokens" }
    decision_kind: configure | dismiss
    threshold: { min_share: 0.03 }
  - id: memory-injected-ignored
    # The ledger counts a hit once per request that has a match, so the ratio is requests with
    # a match, not matches the model used.
    title: Which recall services return a match on the fewest requests?
    signals: [recall_hits_total, recall_requests_total]
    query: { command: "cc-obs-query top memory --by hit-rate" }
    decision_kind: build-tool | configure | dismiss
    threshold: { max_value: 0.5 }
  - id: compaction-frequency
    title: Which sessions grow large enough to compact, and how often?
    signals: [claude_code.compaction.pre_tokens, claude_code.compaction.post_tokens, cc_obs_ledger_context_tokens]
    query: { command: "cc-obs-query top session --by compactions" }
    decision_kind: configure | dismiss
  - id: recall-failures
    title: How often does recall fail or return nothing?
    signals: [recall_requests_total, recall_latency_seconds]
    query: { command: "cc-obs-query recall" }
    decision_kind: build-tool | configure | dismiss
  - id: agent-run-length
    title: Which sessions and sub-agents made the most API requests?
    # The query reads cc_obs_ledger_requests_total; pack.rs does not know that name yet, so the
    # signal listed is the per-request context gauge the same ledger write emits.
    signals: [cc_obs_ledger_context_tokens]
    query: { command: "cc-obs-query top session --by requests" }
    decision_kind: build-tool | configure | dismiss
    threshold: { min_value: 100 }
  - id: agent-context-growth
    title: Which sessions and sub-agents grew their context the most between the first and the largest turn?
    signals: [cc_obs_ledger_context_tokens]
    query: { command: "cc-obs-query top session --by context-growth" }
    decision_kind: build-tool | configure | dismiss
    threshold: { min_value: 200000 }
  - id: costly-sessions
    title: Which sessions cost the most?
    signals: [claude_code.cost.usage]
    query: { command: "cc-obs-query top session --by cost" }
    decision_kind: configure | dismiss
    threshold: { min_share: 0.05 }
  - id: model-spend
    title: Which models account for the most spend?
    signals: [claude_code.cost.usage]
    query: { command: "cc-obs-query top model --by cost" }
    decision_kind: configure | dismiss
    threshold: { min_share: 0.05 }
  - id: delegation-tier-fit
    title: Which sub-agent types spend the most, and on which model?
    signals: [claude_code.cost.usage]
    query: { command: "cc-obs-query top subagent --by cost" }
    decision_kind: configure | dismiss
    threshold: { min_share: 0.03 }
  - id: memory-injection-cost
    title: Which memory services inject the most tokens?
    signals: [recall_tokens_injected_total]
    query: { command: "cc-obs-query top memory --by tokens" }
    decision_kind: build-tool | configure | dismiss
    threshold: { min_share: 0.05 }
