# CVEs accepted by hand, read by scripts/cve-scan.sh (gate 4 of
# docs/update-policy.md). vulnix leaves these out of its findings, so they
# never fail a PR.
#
# Every entry needs a comment saying why it is safe here, and an `until`
# date (at most 90 days ahead) after which it stops applying and the CVE
# fails again. Match on the package and the CVE, never a CVE alone:
#
# ["openssl"]
# cve = ["CVE-2026-12345"]
# until = "2027-02-01"
# comment = "Only reachable through the QUIC server API, which no host uses."

["brotli-1.2.1"]
cve = ["CVE-2026-111497"]
until = "2027-02-25"
comment = "False positive. NVD's own CPE ranges (re-analysed 2026-11-27) end before 1.2.1, and the advisory names 1.2.1 as the fixed release. vulnix's cached data still matches 1.2.1. Only this exact version is excused; 1.1.0 and 1.2.0 still fail."

["polkit-1.pam"]
cve = ["CVE-2021-4034"]
until = "2027-02-25"
comment = "False positive. polkit-1.pam is the NixOS-generated PAM config file for the polkit-1 service, not polkit; vulnix parses its name as polkit version '1.pam'. The real polkit (127 in nixos-26.05) is far past the 0.120 fix for PwnKit."
