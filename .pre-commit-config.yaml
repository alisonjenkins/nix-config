# Hooks for prek (https://github.com/j178/prek), a pre-commit drop-in.
# Install once per clone: `prek install` (the dev shell provides prek).
# Tools come from this flake's pinned nixpkgs, so the hooks match the build.
repos:
  - repo: local
    hooks:
      # writePython3Bin runs flake8 at build time with `--ignore` set to its
      # flakeIgnore list, which replaces flake8's default ignores (W503,
      # W504, E121...). A plain `flake8` run passes code the build rejects,
      # so keep this list equal to each script's flakeIgnore.
      - id: flake8-python-writers
        name: flake8 (as writePython3Bin runs it)
        entry: nix shell --option warn-dirty false --inputs-from . nixpkgs#python3Packages.flake8 --command flake8 --show-source --ignore=E501
        language: system
        files: ^(home/programs/linux-only/(steam-stream-mode/stream_mode|lsfg-vk/patch_config)|pkgs/vr-foveation-bench/(vr_foveation_bench|tests)/[a-z_]+|modules/disk-evacuation/disk_evac)\.py$
      - id: stream-mode-tests
        name: stream-mode tests
        entry: nix shell --option warn-dirty false --inputs-from . nixpkgs#python3 --command python3 -m unittest discover -s home/programs/linux-only/steam-stream-mode/tests
        language: system
        pass_filenames: false
        files: ^home/programs/linux-only/steam-stream-mode/
      - id: vr-foveation-bench-tests
        name: vr-foveation-bench tests
        entry: nix shell --option warn-dirty false --inputs-from . nixpkgs#python3 --command python3 -m unittest discover -s pkgs/vr-foveation-bench/tests -t pkgs/vr-foveation-bench
        language: system
        pass_filenames: false
        files: ^pkgs/vr-foveation-bench/
      # A zero-padded CurseForge CDN path (files/7956/082/) is a 403 in CI.
      - id: forgecdn-paths
        name: CurseForge CDN paths are not zero padded
        entry: .github/scripts/check-forgecdn-paths.sh
        language: system
        pass_filenames: false
        files: ^pkgs/.*\.nix$
      - id: disk-evacuation-tests
        name: disk-evacuation tests
        entry: nix shell --option warn-dirty false --inputs-from . nixpkgs#python3Packages.pytest --command pytest -q -p no:cacheprovider modules/disk-evacuation/tests
        language: system
        pass_filenames: false
        files: ^modules/disk-evacuation/
      # Copilot CLI and other strict parsers drop a skill whose frontmatter
      # Claude Code happily loads (an unquoted ": " in a description).
      - id: skill-frontmatter
        name: skill frontmatter parses as strict YAML
        entry: nix shell --option warn-dirty false --inputs-from . nixpkgs#yq-go --command .github/scripts/check-skill-frontmatter.sh
        language: system
        pass_filenames: false
        files: ^home/skills/[^/]+/SKILL\.md$
      # Every pin needs a registry entry with a reason and a deadline; this
      # fails the commit that adds a pin without one, or removes a pin and
      # leaves its entry behind. See .claude/skills/pins/SKILL.md.
      - id: pins-registry
        name: pin registry matches the code
        entry: nix shell --option warn-dirty false --inputs-from . nixpkgs#python3 --command bash -c "python3 scripts/pins.py check && python3 -m unittest discover -s scripts/tests -p test_pins.py"
        language: system
        pass_filenames: false
        files: ^(flake\.nix|pins/registry\.json|scripts/pins\.py|scripts/tests/test_pins\.py|overlays/default\.nix|modules/base/default\.nix|flake-modules/hosts/[^/]+/default\.nix)$
      - id: nix-pull-build-tests
        name: nix-pull-build integration tests
        entry: bash home/programs/nix-pull-build/tests.sh
        language: system
        pass_filenames: false
        files: ^home/programs/nix-pull-build/
